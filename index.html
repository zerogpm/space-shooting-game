<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>space-shooting</title>
    <link rel="stylesheet" href="./game.css" />
</head>
<body>
    <canvas></canvas>

    <!-- Mute button — always visible in the corner -->
    <button id="mute-button">Mute</button>

    <!-- Game Over overlay — hidden by default, shown when the player dies.
         JavaScript adds the "visible" class to display it with flexbox centering. -->
    <div id="game-over-screen">
        <h1>Game Over</h1>
        <p id="final-score">Score: 0</p>
        <button id="restart-button">Try Again</button>
    </div>

    <!-- Join Game overlay — shown to Player 2 when a game is already in progress. -->
    <div id="join-game-screen">
        <h1>Game In Progress</h1>
        <p>Another player is battling enemies!</p>
        <button id="join-game-button">Join Game</button>
    </div>

    <!-- Spectator banner — shown when you die but the other player is still alive.
         Small banner at top instead of full overlay so you can watch the game. -->
    <div id="spectator-banner">
        <span id="spectator-text">You Died! Watching...</span>
        <button id="spectator-retry-button">Try Again</button>
    </div>

    <!-- Rematch request — shown to the alive player when dead player wants a rematch. -->
    <div id="rematch-screen">
        <h1>Rematch Requested!</h1>
        <p id="rematch-message">The other player wants a rematch.</p>
        <div id="rematch-buttons">
            <button id="accept-rematch-button">Accept</button>
            <button id="decline-rematch-button">Decline</button>
        </div>
    </div>

    <!-- Challenger announcement — shown when a new player drops in mid-game. -->
    <div id="challenger-screen">
        <h1>A NEW CHALLENGER HAS ENTERED THE RING!</h1>
    </div>
</body>
<!-- GSAP is loaded as a regular script (not a module) so it's available as a global.
     ES module scripts are always "deferred" by the browser, meaning they run AFTER
     regular scripts. This guarantees gsap is ready before our game code executes. -->
<script src="gsap.js"></script>
<script type="module" src="./src/main.js"></script>
</html>
